  <div class="login-page">
    <!-- Left Section - Logo and Branding -->
    <div class="login-left-section">
      <div class="logo-container">
        <div class="logo-icon">
          <mat-icon>local_hospital</mat-icon>
        </div>
        <div class="logo-text">
          <div class="brand-name">MediSupply</div>
          <div class="brand-subtitle">Portal de Vendedores</div>
        </div>
      </div>
    </div>

    <!-- Right Section - Login Form -->
    <div class="login-right-section">
      <div class="login-form-container">
        <h1 class="login-title">Inicia sesión - Vendedor</h1>
        
        <!-- Mensaje de error general -->
        <div *ngIf="errorMessage" class="alert alert-error">
          <mat-icon>error</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <form [formGroup]="_form" (ngSubmit)="login()" class="login-form">
          <div class="form-group">
            <label class="form-label">Correo electrónico <span class="required">*</span></label>
            <input 
              type="email" 
              class="form-input" 
              [class.error]="user?.invalid && user?.touched"
              placeholder="Ej: vendedor@ejemplo.com" 
              formControlName="user">
            <div *ngIf="user?.invalid && user?.touched" class="error-message">
              {{ getUserErrorMessage() }}
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Contraseña <span class="required">*</span></label>
            <input 
              type="password" 
              class="form-input" 
              [class.error]="pass?.invalid && pass?.touched"
              placeholder="Digita tu contraseña" 
              formControlName="pass">
            <div *ngIf="pass?.invalid && pass?.touched" class="error-message">
              {{ getPassErrorMessage() }}
            </div>
          </div>
          
          <div class="forgot-password">
            <a routerLink="/vendor/change-password" class="forgot-link">Cambiar contraseña</a>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="btn-primary" [disabled]="!_form.valid || isLoading">
              <span *ngIf="!isLoading">Iniciar sesión</span>
              <span *ngIf="isLoading">
                <mat-icon class="spinner">hourglass_empty</mat-icon>
                Iniciando sesión...
              </span>
            </button>
            <button type="button" class="btn-secondary" (click)="goToSignup()" [disabled]="isLoading">
              Crear cuenta vendedor
            </button>
          </div>
        </form>
        
        <div class="login-info">
          <p>Portal exclusivo para vendedores de MediSupply.</p>
          <p><strong>Usuario de prueba:</strong> vendedor</p>
          <div class="role-switch">
            <a routerLink="/client/login" class="role-link">¿Eres cliente? Accede aquí</a>
          </div>
        </div>
      </div>
    </div>
  </div>
