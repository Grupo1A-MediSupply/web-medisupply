  <div class="change-password-page">
    <!-- Left Section - Logo and Branding -->
    <div class="change-password-left-section">
      <div class="logo-container">
        <div class="logo-icon">
          <mat-icon>local_hospital</mat-icon>
        </div>
        <div class="logo-text">
          <div class="brand-name">MediSupply</div>
          <div class="brand-subtitle">Portal de Vendedores</div>
        </div>
      </div>
    </div>

    <!-- Right Section - Change Password Form -->
    <div class="change-password-right-section">
      <div class="change-password-form-container">
        <h1 class="change-password-title">Cambiar contraseña - Vendedor</h1>
        <p class="change-password-subtitle">Por favor digita tu nueva contraseña segura.</p>
        
        <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="change-password-form">
          <div class="form-group">
            <label class="form-label">Nueva contraseña</label>
            <input 
              type="password" 
              class="form-input" 
              placeholder="Contraseña segura" 
              formControlName="newPassword" 
              required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Confirma tu contraseña</label>
            <input 
              type="password" 
              class="form-input" 
              placeholder="Confirma tu contraseña" 
              formControlName="confirmPassword" 
              required>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="btn-primary" [disabled]="!changePasswordForm.valid">
              Cambiar contraseña
            </button>
            <button type="button" class="btn-secondary" (click)="goToLogin()">
              Volver al login
            </button>
          </div>
        </form>
        
        <div class="change-password-info">
          <p>La contraseña debe tener al menos 8 caracteres y contener letras y números.</p>
          <div class="role-switch">
            <a routerLink="/client/change-password" class="role-link">¿Eres cliente? Cambia tu contraseña aquí</a>
          </div>
        </div>
      </div>
    </div>
  </div>
